appId: dev.cogpit.app
productName: Cogpit
directories:
  buildResources: resources
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc,.prettierignore,.prettierrc,tsconfig.json,tsconfig.*.json}'
  - '!{README.md,SECURITY.md}'
asarUnpack:
  - '**/node_modules/@homebridge/node-pty-prebuilt-multiarch/**'
win:
  target:
    - nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
  icon: resources/icon.png
  category: Development
mac:
  target:
    - dmg
  icon: resources/icon.png
