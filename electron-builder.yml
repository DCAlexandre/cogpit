appId: dev.cogpit.app
productName: Cogpit
directories:
  buildResources: resources
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc,.prettierignore,.prettierrc,tsconfig.json,tsconfig.*.json}'
  - '!{README.md,SECURITY.md}'
asarUnpack:
  - '**/node_modules/@homebridge/node-pty-prebuilt-multiarch/**'
# Ship the licenses alongside the binary: the SIL OFL requires the bundled
# fonts' license to accompany them when redistributed.
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: THIRD-PARTY-LICENSES.md
    to: THIRD-PARTY-LICENSES.md
  - from: src/renderer/src/assets/fonts/OFL.txt
    to: fonts/OFL.txt
win:
  target:
    - nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
  icon: resources/icon.png
  category: Development
mac:
  target:
    - dmg
  icon: resources/icon.png
